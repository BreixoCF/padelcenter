post:
  operationId: createCenter
  summary: Create a new padel center
  description: >
    Creates a new padel center. Requires ADMIN role.
    Returns 201 on success (fix I-2).
  tags:
    - Centers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/center-request.yaml'
        example:
          name: "Padel Center Barcelona"
          address: "Calle Principal 123"
          city: "Barcelona"
          phoneNumber: "933123456"
          email: "barcelona@padelcenter.com"
  responses:
    '201':
      description: Center created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/center-response.yaml'
    '400':
      $ref: '../components/responses/bad-request.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '409':
      $ref: '../components/responses/conflict.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'

get:
  operationId: listCenters
  summary: List all padel centers (paginated)
  description: Returns a paginated list of all padel centers.
  tags:
    - Centers
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
      example: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of records per page.
      example: 20
    - name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort expression. Example "name,asc".
      example: "name,asc"
  responses:
    '200':
      description: Paginated list of centers.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/center-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
