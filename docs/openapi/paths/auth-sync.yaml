post:
  operationId: syncUser
  summary: Sync authenticated Keycloak user into the local database
  description: >
    Called by the frontend immediately after a successful Keycloak login.
    Reads the authenticated JWT, finds or creates a matching local User record,
    and returns it. Idempotent — safe to call on every login.
  tags:
    - Auth
  responses:
    '200':
      description: User record found or created.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
