parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the field.
    example: "f1e2d3c4-b5a6-7890-fedc-ba9876543210"

get:
  operationId: getFieldById
  summary: Get a field by ID
  description: Returns the full field representation for the given ID, including center summary.
  tags:
    - Fields
  responses:
    '200':
      description: Field found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/field-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
