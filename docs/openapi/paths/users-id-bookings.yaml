parameters:
  - name: userId
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the user whose booking history is requested.
    example: "123e4567-e89b-12d3-a456-426614174000"

get:
  operationId: getUserBookings
  summary: Get booking history for a user
  description: >
    Returns the paginated booking history for the specified user.
    Decision D1: moved from GET /api/v1/bookings/users/{userId}
    to GET /api/v1/users/{userId}/bookings for REST resource nesting.
    Response uses unified BookingResponse schema (decision D3).
  tags:
    - Users
    - Bookings
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
      example: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of records per page.
      example: 20
    - name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort expression. Example "startTime,desc".
      example: "startTime,desc"
  responses:
    '200':
      description: Paginated booking history for the user.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/booking-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
