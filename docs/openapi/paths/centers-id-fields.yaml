parameters:
  - name: centerId
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the center.
    example: "aabbccdd-1234-5678-abcd-ef0123456789"

get:
  operationId: listCenterFields
  summary: List fields of a specific center
  description: >
    Returns a paginated list of fields belonging to the specified center.
    Supports optional filtering by field type and availability status.
  tags:
    - Centers
    - Fields
  parameters:
    - name: type
      in: query
      required: false
      schema:
        type: string
      description: Filter by field type (e.g. "Indoor", "Outdoor").
      example: "Indoor"
    - name: available
      in: query
      required: false
      schema:
        type: boolean
      description: Filter by availability status.
      example: true
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
      example: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of records per page.
      example: 20
  responses:
    '200':
      description: Paginated list of fields for the center.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/field-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'

post:
  operationId: createField
  summary: Create a field within a center
  description: >
    Creates a new bookable field inside the specified center.
    Field names must be unique within the same center.
    Requires ADMIN role.
    Returns 201 on success (fix I-2).
  tags:
    - Centers
    - Fields
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/field-request.yaml'
        example:
          name: "Court 1"
          type: "Indoor"
          pricePerHour: 25.00
          isAvailable: true
  responses:
    '201':
      description: Field created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/field-response.yaml'
    '400':
      $ref: '../components/responses/bad-request.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '403':
      $ref: '../components/responses/forbidden.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '409':
      $ref: '../components/responses/conflict.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
