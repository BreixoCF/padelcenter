parameters:
  - name: tournamentId
    in: path
    required: true
    schema:
      type: string
      format: uuid

patch:
  operationId: openRegistration
  summary: Open tournament registration
  description: Transitions the tournament from DRAFT to REGISTRATION_OPEN.
  tags:
    - Tournaments
  responses:
    '200':
      description: Registration opened.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tournament-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '403':
      $ref: '../components/responses/forbidden.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '422':
      $ref: '../components/responses/unprocessable.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
