parameters:
  - name: centerId
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the center.
    example: "aabbccdd-1234-5678-abcd-ef0123456789"

get:
  operationId: getCenterBookings
  summary: Get all bookings for a center (admin dashboard)
  description: >
    Returns a paginated list of all bookings across all fields of the specified center.
    Supports optional filtering by field, specific day, or date range.
    All booking statuses are included.
    Requires ADMIN role (global or center-level).
  tags:
    - Centers
    - Bookings
  parameters:
    - name: date
      in: query
      required: false
      description: Filter by specific day (yyyy-MM-dd). Cannot be combined with startDate/endDate.
      schema:
        type: string
        format: date
      example: "2025-06-20"
    - name: startDate
      in: query
      required: false
      description: Range start inclusive (yyyy-MM-dd).
      schema:
        type: string
        format: date
    - name: endDate
      in: query
      required: false
      description: Range end inclusive (yyyy-MM-dd).
      schema:
        type: string
        format: date
    - name: fieldId
      in: query
      required: false
      description: Filter by field UUID.
      schema:
        type: string
        format: uuid
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of records per page.
  responses:
    '200':
      description: Paginated list of bookings for the center.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/center-booking-summary.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '403':
      $ref: '../components/responses/forbidden.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
