get:
  operationId: listFields
  summary: List all fields (paginated)
  description: Returns a paginated list of all fields across all centers.
  tags:
    - Fields
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
      example: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of records per page.
      example: 20
    - name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort expression. Example "name,asc".
      example: "name,asc"
  responses:
    '200':
      description: Paginated list of fields.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/field-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
