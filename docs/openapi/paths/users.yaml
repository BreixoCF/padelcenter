post:
  operationId: createUser
  summary: Register a new user
  description: >
    Creates a new user account. The caller must be authenticated.
    Returns 201 with the created user on success (fix I-2).
  tags:
    - Users
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/user-request.yaml'
        example:
          firstName: "Ana"
          lastName: "García"
          email: "ana.garcia@example.com"
          password: "securePass123!"
          phoneNumber: "+34600123456"
  responses:
    '201':
      description: User created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-response.yaml'
    '400':
      $ref: '../components/responses/bad-request.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '409':
      $ref: '../components/responses/conflict.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'

get:
  operationId: listUsers
  summary: List all users (paginated)
  description: >
    Returns a paginated list of all users in the system.
    Requires global ADMIN role.
  tags:
    - Users
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
      example: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of records per page.
      example: 20
    - name: sort
      in: query
      required: false
      schema:
        type: string
      description: >
        Sort expression in Spring Data format: "field,direction".
        Direction is "asc" or "desc". Example: "lastName,asc".
      example: "lastName,asc"
  responses:
    '200':
      description: Paginated list of users.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/user-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '403':
      $ref: '../components/responses/forbidden.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
