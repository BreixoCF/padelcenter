type: object
description: >
  Lightweight center representation embedded inside other resources
  (e.g. FieldResponse, BookingResponse). Contains only identifying
  display information — no audit metadata.
required:
  - name
  - address
  - city
properties:
  name:
    type: string
    description: Name of the padel center.
    example: "Padel Center Barcelona"
  address:
    type: string
    description: Street address of the center.
    example: "Calle Principal 123"
  city:
    type: string
    description: City where the center is located.
    example: "Barcelona"
