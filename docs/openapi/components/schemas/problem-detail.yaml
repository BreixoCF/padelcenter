type: object
description: >
  RFC 9457 HTTP Problem Details response body. Returned on all error
  responses (4xx / 5xx) throughout the API.
required:
  - type
  - title
  - status
  - detail
  - timestamp
properties:
  type:
    type: string
    format: uri
    description: URI reference identifying the problem type. 'about:blank' when no specific type is defined.
    example: "about:blank"
  title:
    type: string
    description: Short, human-readable summary of the problem type.
    example: "Resource Not Found"
  status:
    type: integer
    description: HTTP status code generated by the origin server.
    example: 404
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence of the problem.
    example: "User with ID 123e4567-e89b-12d3-a456-426614174000 not found"
  instance:
    type: string
    format: uri
    nullable: true
    description: URI reference identifying the specific occurrence of the problem.
    example: "/api/v1/users/123e4567-e89b-12d3-a456-426614174000"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the problem occurred.
    example: "2025-04-15T10:30:00Z"
  errors:
    type: object
    nullable: true
    description: >
      Map of field-level validation errors. Present only on 400 Bad Request responses
      from bean-validation failures. Keys are field names, values are error messages.
    additionalProperties:
      type: string
    example:
      firstName: "First name is required"
      email: "Email must be valid"
