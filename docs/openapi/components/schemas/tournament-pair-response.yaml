type: object
required:
  - pairId
  - tournamentId
  - player1Id
  - player2Id
  - status
  - registeredAt
properties:
  pairId:
    type: string
    format: uuid
  tournamentId:
    type: string
    format: uuid
  player1Id:
    type: string
    format: uuid
  player2Id:
    type: string
    format: uuid
  status:
    type: string
    enum:
      - PENDING
      - CONFIRMED
      - REJECTED
  registeredAt:
    type: string
    format: date-time
