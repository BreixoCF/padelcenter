type: object
description: >
  Unified booking representation used across all booking operations:
  create, get by id, update, cancel, and booking history.
  Replaces the former CreateBookingResponse, UpdateBookingResponse,
  BookingHistoryResponse, and CancelBookingResponse.
required:
  - bookingId
  - userId
  - field
  - startTime
  - endTime
  - totalPrice
  - bookedAt
  - status
properties:
  bookingId:
    type: integer
    format: int64
    description: Unique numeric identifier of the booking.
    example: 42
  userId:
    type: string
    format: uuid
    description: UUID of the user who owns the booking.
    example: "123e4567-e89b-12d3-a456-426614174000"
  field:
    $ref: './field-summary-response.yaml'
  startTime:
    type: string
    format: date-time
    description: >
      ISO 8601 date-time when the booking slot starts.
      Example format: "2025-06-15T10:00:00".
    example: "2025-06-15T10:00:00"
  endTime:
    type: string
    format: date-time
    description: >
      ISO 8601 date-time when the booking slot ends.
      Must be strictly after startTime.
    example: "2025-06-15T11:00:00"
  totalPrice:
    type: number
    format: double
    description: Total cost of the booking in the system's default currency.
    example: 25.00
  bookedAt:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the booking was originally created.
    example: "2025-04-01T12:00:00Z"
  status:
    type: string
    enum:
      - PENDING
      - CONFIRMED
      - CANCELLED
    description: Current lifecycle status of the booking.
    example: "CONFIRMED"
  audit:
    $ref: './auditable-response.yaml'
