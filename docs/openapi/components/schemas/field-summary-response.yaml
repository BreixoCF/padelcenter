type: object
description: >
  Lightweight field representation embedded inside BookingResponse.
  Includes basic identifying information and a nested center summary.
required:
  - id
  - name
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the field.
    example: "f1e2d3c4-b5a6-7890-fedc-ba9876543210"
  name:
    type: string
    description: Name of the field (e.g. "Court 1").
    example: "Court 1"
  type:
    type: string
    nullable: true
    description: Surface or enclosure type (e.g. "Indoor", "Outdoor", "Cristal").
    example: "Indoor"
  center:
    $ref: './center-summary-response.yaml'
