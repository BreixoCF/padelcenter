type: object
description: >
  Payload for creating a new booking. The booking is created on behalf of
  the authenticated user — userId is extracted from the JWT (fix I-10,
  decision D4), not supplied in the request body.
required:
  - fieldId
  - startTime
  - endTime
  - totalPrice
properties:
  fieldId:
    type: string
    format: uuid
    description: Unique identifier of the field to book.
    example: "f1e2d3c4-b5a6-7890-fedc-ba9876543210"
  startTime:
    type: string
    format: date-time
    description: >
      ISO 8601 date-time when the booking slot starts.
      Format: "YYYY-MM-DDTHH:MM:SS" (local time, no timezone offset).
      Example: "2025-06-15T10:00:00".
    example: "2025-06-15T10:00:00"
  endTime:
    type: string
    format: date-time
    description: >
      ISO 8601 date-time when the booking slot ends.
      Must be strictly after startTime.
    example: "2025-06-15T11:00:00"
  totalPrice:
    type: number
    format: double
    exclusiveMinimum: true
    minimum: 0
    description: Total price for the booking slot. Must be strictly greater than 0.
    example: 25.00
