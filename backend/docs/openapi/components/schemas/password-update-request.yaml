type: object
description: Payload for changing the authenticated user's password via the dedicated password endpoint.
required:
  - currentPassword
  - newPassword
properties:
  currentPassword:
    type: string
    format: password
    minLength: 1
    description: The user's current password, used to confirm identity before the change.
    example: "oldSecurePass123!"
  newPassword:
    type: string
    format: password
    minLength: 8
    description: The desired new password. Minimum 8 characters.
    example: "newSecurePass456!"
