parameters:
  - name: centerId
    in: path
    required: true
    schema:
      type: string
      format: uuid

get:
  operationId: getTournamentsByCenter
  summary: List tournaments for a center
  description: Returns a paginated list of tournaments for the specified center.
  tags:
    - Centers
    - Tournaments
  security: []
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Paginated list of tournaments.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/tournament-response.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
