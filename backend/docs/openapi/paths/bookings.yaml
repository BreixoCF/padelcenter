post:
  operationId: createBooking
  summary: Create a new booking
  description: >
    Creates a booking for the authenticated user on the specified field.
    The userId is extracted from the JWT Bearer token — it must NOT be
    supplied in the request body (decision D4, fix I-10).
    Dates must be in ISO 8601 date-time format (fix I-3).
    Returns 201 on success (fix I-2).
  tags:
    - Bookings
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/booking-request.yaml'
        example:
          fieldId: "f1e2d3c4-b5a6-7890-fedc-ba9876543210"
          startTime: "2025-06-15T10:00:00"
          endTime: "2025-06-15T11:00:00"
          totalPrice: 25.00
  responses:
    '201':
      description: Booking created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/booking-response.yaml'
    '400':
      $ref: '../components/responses/bad-request.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '409':
      $ref: '../components/responses/conflict.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
