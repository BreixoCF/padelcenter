get:
  operationId: getMyBookings
  summary: Get current user's bookings with optional status filter
  description: >
    Returns a paginated list of bookings for the authenticated user,
    optionally filtered by status.
  tags:
    - Auth
    - Bookings
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index.
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of records per page.
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
      description: Filter by booking status.
  responses:
    '200':
      description: Paginated list of the current user's bookings.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/booking-response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
