parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the user whose password is being changed.
    example: "123e4567-e89b-12d3-a456-426614174000"

patch:
  operationId: updatePassword
  summary: Change a user's password
  description: >
    Changes the password for the specified user. The caller must provide the
    current password to confirm identity. On success returns a MessageResponse
    with a confirmation message (decision D3 — replaces UpdatePasswordResponse).
  tags:
    - Users
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/password-update-request.yaml'
        example:
          currentPassword: "oldSecurePass123!"
          newPassword: "newSecurePass456!"
  responses:
    '200':
      description: Password changed successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/message-response.yaml'
          example:
            id: "123e4567-e89b-12d3-a456-426614174000"
            message: "Password updated successfully"
    '400':
      $ref: '../components/responses/bad-request.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      $ref: '../components/responses/not-found.yaml'
    '422':
      $ref: '../components/responses/unprocessable.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
