get:
  operationId: getMyMatches
  summary: Get match history for the current user
  description: >
    Returns a paginated list of matches the authenticated user has played,
    enriched with tournament name and pair team names.
  tags:
    - Auth
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Paginated match history.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/paged-response.yaml'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../components/schemas/match-history-item.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '500':
      $ref: '../components/responses/server-error.yaml'
