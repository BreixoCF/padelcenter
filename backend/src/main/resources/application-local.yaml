spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padelcenterdb}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
    # V2__sample_data.sql was moved to test resources; allow local DBs that had it applied
    ignore-migration-patterns:
logging:
  level:
    com.bookings.padelcenter: INFO
    org.springframework.security: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
    org.springframework.boot.autoconfigure: WARN