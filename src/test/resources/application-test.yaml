spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use jwk-set-uri in tests to avoid OIDC discovery calls at startup.
          # The endpoint is never contacted in unit/integration tests that don't issue HTTP requests.
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
