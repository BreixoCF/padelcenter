spring:
  application:
    name: padelcenter
  profiles:
    active: local
  jpa:
    open-in-view: false
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Provide a non-empty default so the placeholder always resolves.
          # The IssuerUriCondition skips this bean when jwk-set-uri is also present (test profile).
          issuer-uri: ${JWT_ISSUER_URI:https://placeholder.invalid}
