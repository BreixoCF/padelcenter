spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padelcenterdb}
    username: ${SPRING_DATASOURCE_USERNAME:padeluser}
    password: ${SPRING_DATASOURCE_PASSWORD:padelpassword}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V2__sample_data.sql was moved to test resources; allow local DBs that had it applied
    ignore-migration-patterns:

jwt:
  secret: a-string-secret-at-least-256-bits-long

logging:
  level:
    com.bookings.padelcenter: INFO
    org.springframework.security: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
    org.springframework.boot.autoconfigure: WARN