spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padelcenterdb}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V2__sample_data.sql was moved to test resources; allow local DBs that had it applied
    ignore-migration-patterns:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/padelcenter-dev}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/padelcenter-dev/protocol/openid-connect/certs}

keycloak:
  realm: padelcenter-dev
  auth-server-url: http://localhost:8180
  client-id: padelcenter-web

logging:
  level:
    com.bookings.padelcenter: INFO
    org.springframework.security: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
    org.springframework.boot.autoconfigure: WARN